databases:
  - name: teichaku-db
    plan: free
    databaseName: teichaku
    user: teichaku

services:
  - type: web
    plan: free
    name: teichaku-web
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: teichaku-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4